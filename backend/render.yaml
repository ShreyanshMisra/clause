services:
  - type: web
    name: clause-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: VECTOR_BACKEND
        value: snowflake
      - key: ALLOWED_ORIGINS
        sync: false
        # REQUIRED: set to your Vercel URL, e.g. https://clause-yourapp.vercel.app
        # Comma-separate multiple origins. Without this, the deployed frontend is CORS-blocked.
      - key: SECRET_KEY
        sync: false
        # Signs session tokens. Without it, each restart invalidates all logins.
        # Generate: python -c "import secrets;print(secrets.token_hex(32))"
      # --- Snowflake Cortex mode (VECTOR_BACKEND=snowflake) ---
      # The STATUTES table is seeded once out-of-band (python -m app.seed_statutes)
      # and persists in Snowflake; the deployed app only queries it.
      - key: SNOWFLAKE_ACCOUNT
        sync: false
      - key: SNOWFLAKE_USER
        sync: false
      # Auth: key-pair is the default (works with MFA-enforced accounts).
      # Upload rsa_key.p8 as a Render Secret File (mounts at /etc/secrets/rsa_key.p8)
      # and point this at it. The matching public key must be registered on the
      # Snowflake user (ALTER USER ... SET RSA_PUBLIC_KEY=...).
      - key: SNOWFLAKE_PRIVATE_KEY_PATH
        value: /etc/secrets/rsa_key.p8
      # Alternative: for a non-MFA user, drop the key above and set SNOWFLAKE_PASSWORD
      # (sync: false) instead — the app falls back to password auth when no key path is set.
      - key: SNOWFLAKE_WAREHOUSE
        value: CLAUSE_WH
      - key: SNOWFLAKE_DATABASE
        value: CLAUSE_DB
      - key: SNOWFLAKE_SCHEMA
        value: PUBLIC
