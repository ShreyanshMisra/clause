services:
  - type: web
    name: clause-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: VECTOR_BACKEND
        value: local
      - key: ALLOWED_ORIGINS
        sync: false
        # REQUIRED: set to your Vercel URL, e.g. https://clause-yourapp.vercel.app
        # Comma-separate multiple origins. Without this, the deployed frontend is CORS-blocked.
